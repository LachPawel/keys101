<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Keys101</title>
    <meta name="description" content="Keys101: an SO-101 robot arm teaches you a song on a MIDI keyboard, then plays it with you." />
    <link rel="icon" href="img/logo.svg" />
    <link rel="stylesheet" href="css/coach.css" />
  </head>
  <body>
    <header class="top">
      <h1><img class="logo" src="img/logo.svg" alt="" width="28" height="28" />Keys101</h1>
      <div class="stats" aria-label="Your progress">
        <span class="hearts" id="hearts" aria-label="Hearts left"></span>
        <span><b id="xp">0</b> XP</span>
        <span><b id="days">0</b> day streak</span>
      </div>
      <div class="chips">
        <span class="chip" id="chip-sound">Click once for sound</span>
        <span class="chip" id="chip-arm">Arm</span>
        <span class="chip" id="chip-midi">MIDI keyboard</span>
      </div>
    </header>

    <main>
      <section class="say">
        <div class="words">
          <p class="eyebrow" id="eyebrow">Keys101</p>
          <p class="big" id="big">Pick a lesson</p>
          <p class="small" id="small">The arm shows you each key and waits for you.</p>
        </div>
        <div class="john" id="john"><iframe id="john-frame" title="John, a 3D singing head (Chimera)" allow="autoplay"></iframe></div>
      </section>

      <div class="row">
        <div class="phrase" id="phrase" aria-label="The notes of this phrase"></div>
        <p class="score" id="score"></p>
      </div>

      <div class="board">
        <div class="arm-lane" aria-hidden="true"><span class="arm-mark" id="arm-mark">arm</span></div>
        <div class="keys" id="keys" role="group" aria-label="Piano keys: click to play"></div>
      </div>
    </main>

    <footer class="dock">
      <section class="path" aria-label="Your course">
        <p class="label">Course</p>
        <ol class="course" id="course"></ol>
        <p class="caption" id="caption"></p>
        <button type="button" id="reset" class="quiet" title="Start the course over">Start over</button>
      </section>
      <section class="free" aria-label="Free play">
        <p class="label">Free play</p>
        <select id="song" aria-label="Song"></select>
        <div class="modes">
          <button type="button" data-mode="learn" title="The arm shows you each key">Learn</button>
          <button type="button" data-mode="watch" title="The arm plays a phrase, you play it back">Repeat</button>
          <button type="button" data-mode="together" title="You lead, the arm plays the bass">Together</button>
          <button type="button" data-mode="jam" title="You play, the arm answers">Jam</button>
        </div>
        <button type="button" id="stop" class="stop">Stop</button>
      </section>
    </footer>

    <script type="module" src="js/coach.js"></script>
  </body>
</html>
