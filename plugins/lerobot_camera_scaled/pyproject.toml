[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
# Underscores matter: LeRobot's register_third_party_plugins() matches the distribution name against
# "lerobot_camera_" and imports it as a module.
name = "lerobot_camera_scaled"
version = "0.1.0"
description = "LeRobot camera plugin: an OpenCV camera captured at one size and delivered at a smaller one"
requires-python = ">=3.10"
dependencies = []

[tool.setuptools]
packages = ["lerobot_camera_scaled"]
